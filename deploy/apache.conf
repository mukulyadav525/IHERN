# Apache in front of the two Node processes (mod_proxy, mod_proxy_http,
# mod_headers). Adjust host names and certificate paths to the server's.

# --- Main site: https://iiitd.ac.in/IHERN/  (built with NEXT_PUBLIC_BASE_PATH=/IHERN)
# Inside the existing iiitd.ac.in <VirtualHost *:443>:
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass        /IHERN http://127.0.0.1:3000/IHERN
ProxyPassReverse /IHERN http://127.0.0.1:3000/IHERN

# --- Blog: https://ihernblog.iiitd.ac.in/
<VirtualHost *:443>
    ServerName ihernblog.iiitd.ac.in
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ihernblog.crt
    SSLCertificateKeyFile /etc/ssl/private/ihernblog.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Images up to 10 MB are uploaded in the admin area.
    LimitRequestBody 12582912
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
