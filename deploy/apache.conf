# Apache in front of the two Node processes (mod_proxy, mod_proxy_http,
# mod_headers), both under one address:
#
#   https://iiitd.ac.in/IHERN        main site  port 3000  (NEXT_PUBLIC_BASE_PATH=/IHERN)
#   https://iiitd.ac.in/IHERN/blog   blog       port 3001  (NEXT_PUBLIC_BASE_PATH=/IHERN/blog)
#
# Inside the iiitd.ac.in <VirtualHost *:443>. The blog's lines come first:
# Apache uses the first ProxyPass that matches, and /IHERN would match both.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# --- Blog
ProxyPass        /IHERN/blog http://127.0.0.1:3001/IHERN/blog
ProxyPassReverse /IHERN/blog http://127.0.0.1:3001/IHERN/blog
<Location /IHERN/blog>
    # Images up to 10 MB are uploaded in the admin area.
    LimitRequestBody 12582912
</Location>

# --- Main site
ProxyPass        /IHERN http://127.0.0.1:3000/IHERN
ProxyPassReverse /IHERN http://127.0.0.1:3000/IHERN
