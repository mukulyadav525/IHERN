# Apache in front of the two Node processes (mod_proxy, mod_proxy_http,
# mod_headers), both under one address:
#
#   https://ihern.iiitd.edu.in        main site  port 3000  (NEXT_PUBLIC_BASE_PATH empty)
#   https://ihern.iiitd.edu.in/blog   blog       port 3001  (NEXT_PUBLIC_BASE_PATH=/blog)
#
# The blog's lines come first: Apache uses the first ProxyPass that matches,
# and / matches everything. Paths go through unchanged (no rewriting): each app
# already answers at its public path. Certificate paths are the server's own.

<VirtualHost *:443>
    ServerName ihern.iiitd.edu.in
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ihern.iiitd.edu.in.crt
    SSLCertificateKeyFile /etc/ssl/private/ihern.iiitd.edu.in.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # --- Blog
    ProxyPass        /blog http://127.0.0.1:3001/blog
    ProxyPassReverse /blog http://127.0.0.1:3001/blog
    <Location /blog>
        # Images up to 10 MB are uploaded in the admin area.
        LimitRequestBody 12582912
    </Location>

    # --- Main site (posters and photographs up to 10 MB in its admin areas)
    LimitRequestBody 12582912
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

# Plain http: send everyone to https.
<VirtualHost *:80>
    ServerName ihern.iiitd.edu.in
    Redirect permanent / https://ihern.iiitd.edu.in/
</VirtualHost>
